<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Titanium White Metallic Gradient -->
    <linearGradient id="psycodes-titanium" x1="50" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Laser Cyan Glow Gradient -->
    <radialGradient id="psycodes-cyan-glow" cx="50" cy="48" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Laser Cyan Solid Gradient -->
    <linearGradient id="psycodes-cyan" x1="46" y1="44" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38E8FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <!-- Filter for subtle drop-glow -->
    <filter id="cyan-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Neural Glow -->
  <circle cx="50" cy="48" r="14" fill="url(#psycodes-cyan-glow)" />

  <!-- The Minimalist Psi Monolith (Ψ) Geometric Structure -->
  <g fill="url(#psycodes-titanium)">
    <!-- Central Monolith Spine (Vertical Stem of Psi) -->
    <path d="M46 20 C46 17.8 54 17.8 54 20 L54 78 C54 81 46 81 46 78 Z" />

    <!-- Left Wing of Psi (Curved / Angled Code Bracket) -->
    <path d="M22 28 C22 24 30 24 30 28 L30 46 C30 57 37 64 43 64 C45 64 45 71 42 71 C32 71 22 61 22 46 Z" />

    <!-- Right Wing of Psi (Curved / Angled Code Bracket) -->
    <path d="M78 28 C78 24 70 24 70 28 L70 46 C70 57 63 64 57 64 C55 64 55 71 58 71 C68 71 78 61 78 46 Z" />

    <!-- Horizontal Syntax Interlock Facet -->
    <rect x="42" y="78" width="16" height="5" rx="2.5" />
  </g>

  <!-- Central Laser-Cyan Neural Core Node (The Spark of Code) -->
  <circle cx="50" cy="48" r="4.5" fill="url(#psycodes-cyan)" filter="url(#cyan-bloom)" />
  <circle cx="50" cy="48" r="1.8" fill="#FFFFFF" />
</svg>
