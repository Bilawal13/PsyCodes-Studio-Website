<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Luminous Cyan Star Glow Filter (Light Mode) -->
    <filter id="star-glow-light" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feFlood floodColor="#00F2FE" floodOpacity="0.65" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 2D Line-Art Wireframe Geometric Psi Structure (Light Mode / White BG) -->
  <g stroke="#090D16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Pediment / Cap -->
    <polygon points="46,24 74,24 68,30 52,30" fill="rgba(9,13,22,0.04)" />
    <line x1="60" y1="24" x2="60" y2="30" />

    <!-- Upper Stem Column -->
    <polygon points="52,30 68,30 64,44 56,44" fill="rgba(9,13,22,0.02)" />
    <line x1="60" y1="30" x2="60" y2="44" />

    <!-- Central Diamond Nexus Cell -->
    <polygon points="60,44 74,58 60,72 46,58" fill="none" stroke="#090D16" stroke-width="2" />
    <line x1="46" y1="58" x2="74" y2="58" stroke-width="1" stroke="rgba(9,13,22,0.4)" />
    <line x1="60" y1="44" x2="60" y2="72" stroke-width="1" stroke="rgba(9,13,22,0.4)" />

    <!-- Lower Stem Column -->
    <polygon points="56,72 64,72 68,88 52,88" fill="rgba(9,13,22,0.02)" />
    <line x1="60" y1="72" x2="60" y2="88" />

    <!-- Base Pedestal / Foot -->
    <polygon points="52,88 68,88 74,94 46,94" fill="rgba(9,13,22,0.04)" />
    <line x1="60" y1="88" x2="60" y2="94" />

    <!-- Left Wing Outer Line -->
    <path d="M46,94 C34,88 22,74 20,56 C18,40 22,28 24,24 C24,23 20,23 18,25 C14,35 14,58 24,78 C30,88 42,92 46,94 Z" fill="rgba(9,13,22,0.02)" />

    <!-- Left Wing Inner Facet Struts -->
    <line x1="24" y1="24" x2="46" y2="58" />
    <line x1="20" y1="56" x2="46" y2="58" />
    <line x1="24" y1="78" x2="46" y2="58" />
    <line x1="46" y1="58" x2="46" y2="94" />

    <!-- Right Wing Outer Line -->
    <path d="M74,94 C86,88 98,74 100,56 C102,40 98,28 96,24 C96,23 100,23 102,25 C106,35 106,58 96,78 C90,88 78,92 74,94 Z" fill="rgba(9,13,22,0.02)" />

    <!-- Right Wing Inner Facet Struts -->
    <line x1="96" y1="24" x2="74" y2="58" />
    <line x1="100" y1="56" x2="74" y2="58" />
    <line x1="96" y1="78" x2="74" y2="58" />
    <line x1="74" y1="58" x2="74" y2="94" />
  </g>

  <!-- Central 4-Point Star Node with Radiant Cyan Light -->
  <polygon points="60,49 63,58 72,58 64.5,61.5 60,67 55.5,61.5 48,58 57,58" fill="#00F2FE" filter="url(#star-glow-light)" />
  <circle cx="60" cy="58" r="1.8" fill="#FFFFFF" />
</svg>
