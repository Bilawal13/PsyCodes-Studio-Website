<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <!-- Solid, Bold Architectural Silhouette with zero micro-facet noise (Light Mode) -->
  <g stroke="#080C18" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Central Spire -->
    <path d="M 430 160 L 570 160 L 570 240 L 500 320 L 430 240 Z" fill="rgba(0,0,0,0.02)" />

    <!-- Central Rhombus Diamond -->
    <path d="M 500 320 L 680 500 L 500 680 L 320 500 Z" fill="#FFFFFF" stroke-width="36" />

    <!-- Left Wing Sweep -->
    <path d="M 320 500 C 230 550 170 480 155 390 L 135 160 L 220 160 C 250 260 295 365 375 445" />

    <!-- Right Wing Sweep -->
    <path d="M 680 500 C 770 550 830 480 845 390 L 865 160 L 780 160 C 750 260 705 365 625 445" />

    <!-- Lower Pediment Base -->
    <path d="M 460 680 L 460 760 L 360 840 L 640 840 L 540 760 L 540 680" />
    <line x1="360" y1="840" x2="640" y2="840" stroke-width="38" />
  </g>

  <!-- Refined High-Contrast Core Star -->
  <polygon points="500,385 516,484 615,500 516,516 500,615 484,516 385,500 484,484" fill="#00DDEB" />
  <circle cx="500" cy="500" r="6" fill="#080C18" />
</svg>
