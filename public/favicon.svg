<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Obsidian Container Squircle -->
  <rect width="64" height="64" rx="14" fill="#080C14" />
  <rect width="64" height="64" rx="14" stroke="#1E293B" stroke-width="1.2" />

  <!-- 2D Line-Art Wireframe Psi Structure -->
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Cap -->
    <line x1="25" y1="14" x2="39" y2="14" />
    <polygon points="25,14 39,14 36,18 28,18" fill="rgba(255,255,255,0.1)" />

    <!-- Upper Stem -->
    <polygon points="28,18 36,18 34,26 30,26" />
    <line x1="32" y1="18" x2="32" y2="26" />

    <!-- Diamond Nexus -->
    <polygon points="32,26 39,33 32,40 25,33" fill="rgba(0,242,254,0.12)" stroke="#FFFFFF" stroke-width="1.8" />
    <line x1="25" y1="33" x2="39" y2="33" stroke-width="0.8" stroke="rgba(255,255,255,0.6)" />
    <line x1="32" y1="26" x2="32" y2="40" stroke-width="0.8" stroke="rgba(255,255,255,0.6)" />

    <!-- Lower Stem -->
    <polygon points="30,40 34,40 36,48 28,48" />

    <!-- Base Pedestal -->
    <polygon points="28,48 36,48 39,52 25,52" fill="rgba(255,255,255,0.1)" />

    <!-- Left Wing -->
    <path d="M25,52 C18,48 12,41 11,32 C10,23 12,16 13,14 C13,13 11,13 10,14 C8,19 8,33 13,44 C17,50 23,51 25,52 Z" />
    <line x1="13" y1="14" x2="25" y2="33" />
    <line x1="11" y1="32" x2="25" y2="33" />
    <line x1="13" y1="44" x2="25" y2="33" />

    <!-- Right Wing -->
    <path d="M39,52 C46,48 52,41 53,32 C54,23 52,16 51,14 C51,13 53,13 54,14 C56,19 56,33 51,44 C47,50 41,51 39,52 Z" />
    <line x1="51" y1="14" x2="39" y2="33" />
    <line x1="53" y1="32" x2="39" y2="33" />
    <line x1="51" y1="44" x2="39" y2="33" />
  </g>

  <!-- Glowing Laser-Cyan Star Node -->
  <polygon points="32,29 33.5,33 37.5,33 34,35 32,38 30,35 26.5,33 30.5,33" fill="#00F2FE" />
  <circle cx="32" cy="33" r="1.2" fill="#FFFFFF" />
</svg>
