    <!-- Left Wing -->
    <path d="M14 18 C14 15 19 15 19 18 L19 29 C19 36 24 41 28 41 C29.5 41 29.5 46 27.5 46 C21 46 14 40 14 29 Z" />
    <!-- Right Wing -->
    <path d="M50 18 C50 15 45 15 45 18 L45 29 C45 36 40 41 36 41 C34.5 41 34.5 46 36.5 46 C43 46 50 40 50 29 Z" />
    <!-- Base Anchor -->
    <rect x="27" y="49" width="10" height="3.5" rx="1.75" />
  </g>

