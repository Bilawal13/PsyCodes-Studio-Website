<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" id="meta-color-scheme" />
  <title>PsyCodes Studio — Code. Create. Automate.</title>
  <meta name="description" content="PsyCodes Studio — High-velocity cyber-luxe software engineering, AI agents, mobile applications, and Unity 6 game systems founded by Bilawal Feroze." />
  
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('psycodes-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        var root = document.documentElement;
        root.classList.remove('dark', 'light');
        root.classList.add(theme);
        root.setAttribute('data-theme', theme);
        var meta = document.getElementById('meta-color-scheme');
        if (meta) meta.content = theme;
      } catch (e) {}
    })();
  </script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased selection:bg-tertiary/20 selection:text-tertiary min-h-screen flex flex-col">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
