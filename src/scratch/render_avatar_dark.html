<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Avatar Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: #080C18;
    }
    .wrapper {
      width: 1024px;
      height: 1024px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#080C18" />
  
    <radialGradient id="av-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00DDEB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080C18" stop-opacity="0" />
    </radialGradient>
    <circle cx="512" cy="512" r="380" fill="url(#av-glow)" />
  
  <rect x="32" y="32" width="960" height="960" rx="200" fill="none" stroke="rgba(0, 221, 235, 0.25)" stroke-width="4" />
  <g transform="translate(162, 162)">
    
    <g transform="scale(0.7)">
      <defs>
        
        <filter id="dark-core-glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="35" result="blur1" />
          <feGaussianBlur stdDeviation="70" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <radialGradient id="star-radial-core" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00F2FE" stop-opacity="1" />
          <stop offset="70%" stop-color="#00DDEB" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#00B8D9" stop-opacity="0.75" />
        </radialGradient>
        
      </defs>

      <!-- Outer Psi Architectural Contour -->
      <path d="M 60 160 C 90 280 120 420 180 540 C 230 640 280 690 380 720 L 380 790 L 320 850 L 680 850 L 620 790 L 620 720 C 720 690 770 640 820 540 C 880 420 910 280 940 160 C 890 190 840 250 800 340 C 760 430 720 500 650 540 C 630 460 630 310 630 160 L 370 160 C 370 310 370 460 350 540 C 280 500 240 430 200 340 C 160 250 110 190 60 160 Z" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />

      <!-- Internal Engineering Facets -->
      <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
        <path d="M 370 160 L 500 230 L 630 160" fill="none" />
        <path d="M 500 230 L 500 370" fill="none" />
        <path d="M 370 160 L 500 370 L 630 160" fill="none" />
        <path d="M 500 630 L 500 790" fill="none" />
        <path d="M 380 720 L 500 630 L 620 720" fill="none" />
        <path d="M 380 790 L 500 850 L 620 790" fill="none" />
        <path d="M 60 160 L 200 340" fill="none" />
        <path d="M 940 160 L 800 340" fill="none" />
        <path d="M 200 340 L 350 540" fill="none" />
        <path d="M 800 340 L 650 540" fill="none" />
        <path d="M 180 540 L 370 500" fill="none" />
        <path d="M 820 540 L 630 500" fill="none" />
        <path d="M 280 690 L 500 630" fill="none" />
        <path d="M 720 690 L 500 630" fill="none" />
      </g>

      <!-- Central Diamond Structure -->
      <path d="M 500 370 L 630 500 L 500 630 L 370 500 Z" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />

      <!-- Glowing Radiant Cyan Star -->
      <path d="M 500 420 Q 500 475 525 475 Q 525 500 580 500 Q 525 500 525 525 Q 500 525 500 580 Q 500 525 475 525 Q 475 500 420 500 Q 475 500 475 475 Q 500 475 500 420 Z" fill="url(#star-radial-core)" stroke="#00DDEB" stroke-width="3" filter="url(#dark-core-glow)" />
    </g>
  
  </g>
</svg>
  </div>
</body>
</html>
